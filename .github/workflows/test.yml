name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Only install what the test suite actually needs (Phase 1 deps).
          # Heavy Phase 3/4 extras (chromadb, sentence-transformers, streamlit,
          # google-generativeai) are skipped here to keep CI fast and reliable;
          # they will be added once those phases are tested.
          pip install \
            "SQLAlchemy>=2.0,<3.0" \
            "pandas>=2.1,<3.0" \
            "PyYAML>=6.0,<7.0" \
            "pytest>=8.0,<9.0" \
            "pytest-cov>=5.0,<6.0"
      - name: Seed databases
        run: python scripts/seed_all.py
      - name: Test
        # Exit code 5 means "no tests collected" (skeleton main branch).
        # Treat that as success so main is never red just for being empty.
        run: |
          pytest -q --tb=short -m "not mysql and not llm and not ollama and not slow" \
            || [ $? -eq 5 ]
        env:
          # SQLite paths only; never put real keys here
          SMARTSQL_ENV: test
