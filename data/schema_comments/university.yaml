# data/schema_comments/university.yaml
# Human-readable descriptions for the university database.
# Loaded by smartsql.db.comments and merged into the schema snapshot.
# Format: table_name -> {_comment: "table description", col_name: "col description"}

departments:
  _comment: "Academic departments within the university."
  dept_id: "Surrogate primary key."
  code: "Short department code, e.g. 'CSE' for Computer Science and Engineering."
  name: "Full department name."
  building: "Campus building where the department is housed."
  budget: "Annual operating budget in INR."

instructors:
  _comment: "Teaching faculty members."
  instructor_id: "Surrogate primary key."
  name: "Full name of the instructor."
  email: "Institutional email address (unique)."
  dept_id: "Department this instructor belongs to."
  rank: "Academic rank: Assistant, Associate, or Professor."

students:
  _comment: "Enrolled and graduated students."
  student_id: "Surrogate primary key."
  name: "Full name of the student."
  email: "Institutional email address (unique)."
  dept_id: "Department the student is enrolled in."
  gpa: "Cumulative grade-point average on a 4.0 scale. A 'high performer' has GPA >= 3.7."
  year: "Academic year: 1=Freshman, 2=Sophomore, 3=Junior, 4=Senior."
  status: "Enrollment status: active, inactive, or graduated."

courses:
  _comment: "Courses offered by the university."
  course_id: "Surrogate primary key."
  code: "Course code, e.g. 'CS101'."
  title: "Descriptive title of the course."
  dept_id: "Department that owns the course."
  credits: "Credit hours awarded on completion."
  instructor_id: "Primary instructor for the course."

enrollments:
  _comment: "Many-to-many link between students and courses for a given semester."
  enrollment_id: "Surrogate primary key."
  student_id: "Enrolled student."
  course_id: "Course being taken."
  semester: "Semester identifier, e.g. '2024-Fall'."

grades:
  _comment: "Final grades for each enrollment record."
  grade_id: "Surrogate primary key."
  enrollment_id: "Links to the enrollment this grade belongs to."
  score: "Numeric score (0–100)."
  letter_grade: "Letter grade: A, B, C, D, or F."
