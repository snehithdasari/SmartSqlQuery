# data/schema_comments/hr_analytics.yaml
# Human-readable descriptions for the hr_analytics database.

departments:
  _comment: "Organizational departments."
  dept_id: "Surrogate primary key."
  name: "Department name, e.g. Engineering, Sales, IT."
  location: "Office block where the department is located."

employees:
  _comment: "All current and former employees. An 'active employee' has status = 'active'."
  employee_id: "Surrogate primary key."
  name: "Employee full name."
  email: "Corporate email (unique)."
  dept_id: "Department the employee belongs to."
  job_title: "Job designation."
  hire_date: "Date the employee joined (ISO 8601)."
  status: "Employment status: active, terminated, or on_leave."
  manager_id: "Self-referential FK to the employee's direct manager."

salaries:
  _comment: "Salary records; multiple rows per employee represent pay changes over time."
  salary_id: "Surrogate primary key."
  employee_id: "Employee this salary record belongs to."
  amount: "Gross annual salary in INR."
  effective: "Date from which this salary is effective (ISO 8601)."
  currency: "Currency code (default INR)."

performance_reviews:
  _comment: "Annual performance evaluations. Score is 1.0–5.0; 'high performer' means score >= 4.0."
  review_id: "Surrogate primary key."
  employee_id: "Employee being reviewed."
  review_date: "Date the review was conducted."
  score: "Numeric performance score (1.0–5.0)."
  rating: "Rating label: Outstanding, Exceeds, Meets, Below, or Unsatisfactory."
  reviewer_id: "Employee who conducted the review (manager)."

projects:
  _comment: "Departmental projects with budgets and timelines."
  project_id: "Surrogate primary key."
  name: "Project name."
  dept_id: "Owning department."
  start_date: "Project start date."
  end_date: "Project end date (NULL if still active)."
  status: "Project status: active, completed, or on_hold."
  budget: "Allocated budget in INR."

project_assignments:
  _comment: "Many-to-many link between projects and employees."
  assignment_id: "Surrogate primary key."
  project_id: "Project being worked on."
  employee_id: "Assigned employee."
  role: "Employee's role on the project."
