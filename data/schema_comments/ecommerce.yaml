# data/schema_comments/ecommerce.yaml
# Human-readable descriptions for the ecommerce database.

categories:
  _comment: "Product categories."
  category_id: "Surrogate primary key."
  name: "Category name, e.g. Electronics, Clothing."
  description: "Short description of the category."

products:
  _comment: "Items available for purchase."
  product_id: "Surrogate primary key."
  name: "Product name."
  category_id: "Category this product belongs to."
  price: "Listed price in INR."
  stock: "Units currently in stock."

customers:
  _comment: "Registered buyers on the platform. A 'churned customer' is one who has not placed an order in over 180 days."
  customer_id: "Surrogate primary key."
  name: "Customer full name."
  email: "Contact email (unique)."
  city: "City of residence."
  joined_date: "Date the customer registered (ISO 8601)."

orders:
  _comment: "Customer purchase orders."
  order_id: "Surrogate primary key."
  customer_id: "Customer who placed the order."
  order_date: "Date the order was placed (ISO 8601)."
  status: "Order status: pending, shipped, delivered, cancelled, or refunded."

order_items:
  _comment: "Individual line items within an order."
  item_id: "Surrogate primary key."
  order_id: "Parent order."
  product_id: "Product purchased."
  quantity: "Number of units ordered."
  unit_price: "Price per unit at time of purchase (may differ from current product price)."

payments:
  _comment: "Payment records linked to orders (one payment per order)."
  payment_id: "Surrogate primary key."
  order_id: "Corresponding order (unique — one payment per order)."
  amount: "Total amount paid in INR."
  method: "Payment method: card, upi, netbanking, or cod."
  paid_date: "Date payment was received (NULL if not yet paid)."
  status: "Payment status: paid, pending, refunded, or failed."
