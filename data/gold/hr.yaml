- id: hr_024
  question: "Which employees work on more than one project?"
  gold_sql: >
    SELECT e.name, COUNT(pa.project_id) AS project_count
    FROM project_assignments pa
    JOIN employees e ON pa.employee_id = e.employee_id
    GROUP BY pa.employee_id, e.name
    HAVING COUNT(pa.project_id) > 1
    ORDER BY project_count DESC
  required_tables: [project_assignments, employees]
  tags: [join, aggregate, filter]

