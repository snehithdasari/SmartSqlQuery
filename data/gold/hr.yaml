# data/gold/hr.yaml
# Gold NL<->SQL pairs for the hr_analytics database.
# T-1.12: ~25 questions

- id: hr_001
  question: "What is the average salary by department?"
  gold_sql: >
    SELECT d.name AS department, ROUND(AVG(s.amount), 2) AS avg_salary
    FROM salaries s
    JOIN employees e ON s.employee_id = e.employee_id
    JOIN departments d ON e.dept_id = d.dept_id
    WHERE e.status = 'active'
    GROUP BY d.dept_id, d.name
    ORDER BY avg_salary DESC
  required_tables: [salaries, employees, departments]
  tags: [join, aggregate]

- id: hr_002
  question: "List all active employees in the IT department."
  gold_sql: >
    SELECT e.name, e.job_title, e.hire_date
    FROM employees e
    JOIN departments d ON e.dept_id = d.dept_id
    WHERE d.name = 'IT' AND e.status = 'active'
    ORDER BY e.hire_date
  required_tables: [employees, departments]
  tags: [filter, join]

- id: hr_003
  question: "Who are the high performers in the last review cycle?"
  gold_sql: >
    SELECT e.name, pr.score, pr.rating, d.name AS department
    FROM performance_reviews pr
    JOIN employees e ON pr.employee_id = e.employee_id
    JOIN departments d ON e.dept_id = d.dept_id
    WHERE pr.score >= 4.0
    ORDER BY pr.score DESC
  required_tables: [performance_reviews, employees, departments]
  tags: [filter, join, jargon]

- id: hr_004
  question: "How many employees are in each department?"
  gold_sql: >
    SELECT d.name, COUNT(e.employee_id) AS headcount
    FROM departments d
    LEFT JOIN employees e ON d.dept_id = e.dept_id AND e.status = 'active'
    GROUP BY d.dept_id, d.name
    ORDER BY headcount DESC
  required_tables: [departments, employees]
  tags: [join, aggregate]

- id: hr_005
  question: "What is the total payroll cost for the Engineering department?"
  gold_sql: >
    SELECT ROUND(SUM(s.amount), 2) AS total_payroll
    FROM salaries s
    JOIN employees e ON s.employee_id = e.employee_id
    JOIN departments d ON e.dept_id = d.dept_id
    WHERE d.name = 'Engineering' AND e.status = 'active'
  required_tables: [salaries, employees, departments]
  tags: [filter, join, aggregate]
  expected_row_count: 1

- id: hr_006
  question: "List employees who are currently on leave."
  gold_sql: >
    SELECT e.name, e.job_title, d.name AS department
    FROM employees e
    JOIN departments d ON e.dept_id = d.dept_id
    WHERE e.status = 'on_leave'
  required_tables: [employees, departments]
  tags: [filter, join]

- id: hr_007
  question: "Which employee has the highest salary?"
  gold_sql: >
    SELECT e.name, s.amount AS salary, d.name AS department
    FROM salaries s
    JOIN employees e ON s.employee_id = e.employee_id
    JOIN departments d ON e.dept_id = d.dept_id
    ORDER BY s.amount DESC
    LIMIT 1
  required_tables: [salaries, employees, departments]
  tags: [aggregate, join]
  expected_row_count: 1

- id: hr_008
  question: "How many active projects are there?"
  gold_sql: >
    SELECT COUNT(*) AS active_projects
    FROM projects
    WHERE status = 'active'
  required_tables: [projects]
  tags: [filter, aggregate]
  expected_row_count: 1

- id: hr_009
  question: "Who reports to Rahul Mehta?"
  gold_sql: >
    SELECT e.name, e.job_title
    FROM employees e
    JOIN employees m ON e.manager_id = m.employee_id
    WHERE m.name = 'Rahul Mehta'
  required_tables: [employees]
  tags: [filter, join]

- id: hr_010
  question: "What is the average performance score by department?"
  gold_sql: >
    SELECT d.name, ROUND(AVG(pr.score), 2) AS avg_score
    FROM performance_reviews pr
    JOIN employees e ON pr.employee_id = e.employee_id
    JOIN departments d ON e.dept_id = d.dept_id
    GROUP BY d.dept_id, d.name
    ORDER BY avg_score DESC
  required_tables: [performance_reviews, employees, departments]
  tags: [join, aggregate]

- id: hr_011
  question: "Which employees are assigned to the Cloud Migration project?"
  gold_sql: >
    SELECT e.name, e.job_title, pa.role
    FROM project_assignments pa
    JOIN employees e ON pa.employee_id = e.employee_id
    JOIN projects p ON pa.project_id = p.project_id
    WHERE p.name = 'Cloud Migration'
  required_tables: [project_assignments, employees, projects]
  tags: [filter, join]

- id: hr_012
  question: "List all terminated employees."
  gold_sql: >
    SELECT e.name, e.job_title, d.name AS department, e.hire_date
    FROM employees e
    JOIN departments d ON e.dept_id = d.dept_id
    WHERE e.status = 'terminated'
  required_tables: [employees, departments]
  tags: [filter, join]

- id: hr_013
  question: "How many employees joined each year?"
  gold_sql: >
    SELECT SUBSTR(hire_date, 1, 4) AS year, COUNT(*) AS joiners
    FROM employees
    GROUP BY year
    ORDER BY year
  required_tables: [employees]
  tags: [aggregate]

- id: hr_014
  question: "What is the budget of each active project?"
  gold_sql: >
    SELECT name, budget, dept_id, start_date
    FROM projects
    WHERE status = 'active'
    ORDER BY budget DESC
  required_tables: [projects]
  tags: [filter]

- id: hr_015
  question: "Which departments have employees with salaries above 1 million?"
  gold_sql: >
    SELECT DISTINCT d.name
    FROM departments d
    JOIN employees e ON d.dept_id = e.dept_id
    JOIN salaries s ON e.employee_id = s.employee_id
    WHERE s.amount > 1000000 AND e.status = 'active'
    ORDER BY d.name
  required_tables: [departments, employees, salaries]
  tags: [filter, join]

- id: hr_016
  question: "Show the salary of each employee along with their department."
  gold_sql: >
    SELECT e.name, d.name AS department, e.job_title, s.amount AS salary
    FROM employees e
    JOIN departments d ON e.dept_id = d.dept_id
    JOIN salaries s ON e.employee_id = s.employee_id
    ORDER BY s.amount DESC
  required_tables: [employees, departments, salaries]
  tags: [join]

- id: hr_017
  question: "Who is the highest-rated employee?"
  gold_sql: >
    SELECT e.name, pr.score, pr.rating
    FROM performance_reviews pr
    JOIN employees e ON pr.employee_id = e.employee_id
