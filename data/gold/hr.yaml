    LIMIT 1
  required_tables: [performance_reviews, employees]
  tags: [aggregate, join]
  expected_row_count: 1

- id: hr_018
  question: "How many projects does each department own?"
  gold_sql: >
    SELECT d.name, COUNT(p.project_id) AS project_count
    FROM departments d
    LEFT JOIN projects p ON d.dept_id = p.dept_id
    GROUP BY d.dept_id, d.name
    ORDER BY project_count DESC
  required_tables: [departments, projects]
  tags: [join, aggregate]

- id: hr_019
  question: "List employees hired after 2022 who are still active."
  gold_sql: >
    SELECT e.name, e.job_title, e.hire_date, d.name AS department
    FROM employees e
    JOIN departments d ON e.dept_id = d.dept_id
    WHERE e.hire_date > '2022-12-31' AND e.status = 'active'
    ORDER BY e.hire_date
  required_tables: [employees, departments]
  tags: [filter, join]

