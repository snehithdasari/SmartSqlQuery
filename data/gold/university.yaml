- id: univ_021
  question: "Which students failed any course?"
  gold_sql: >
    SELECT DISTINCT s.name, s.email
    FROM students s
    JOIN enrollments e ON s.student_id = e.student_id
    JOIN grades g ON e.enrollment_id = g.enrollment_id
    WHERE g.letter_grade = 'F'
  required_tables: [students, enrollments, grades]
  tags: [filter, join]

- id: univ_022
