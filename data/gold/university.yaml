# data/gold/university.yaml
# Gold NL<->SQL pairs for the university database.
# Tags: filter | join | aggregate | ambiguous | jargon
# T-1.12: ~25 questions

- id: univ_001
  question: "How many students are enrolled in the CSE department?"
  gold_sql: >
    SELECT COUNT(*) AS student_count
    FROM students s
    JOIN departments d ON s.dept_id = d.dept_id
    WHERE d.code = 'CSE'
  required_tables: [students, departments]
  tags: [filter, join, aggregate]
  expected_row_count: 1

- id: univ_002
  question: "List all active students."
  gold_sql: >
    SELECT student_id, name, email, gpa, year
    FROM students
    WHERE status = 'active'
    ORDER BY name
  required_tables: [students]
  tags: [filter]

- id: univ_003
  question: "What is the average GPA of students in each department?"
  gold_sql: >
    SELECT d.name AS department, ROUND(AVG(s.gpa), 2) AS avg_gpa
    FROM students s
    JOIN departments d ON s.dept_id = d.dept_id
    GROUP BY d.dept_id, d.name
    ORDER BY avg_gpa DESC
  required_tables: [students, departments]
  tags: [join, aggregate]

- id: univ_004
  question: "Which courses are offered by the Mathematics department?"
  gold_sql: >
    SELECT c.code, c.title, c.credits
    FROM courses c
    JOIN departments d ON c.dept_id = d.dept_id
    WHERE d.code = 'MATH'
  required_tables: [courses, departments]
  tags: [filter, join]

- id: univ_005
  question: "Who are the high performers among students?"
  gold_sql: >
    SELECT student_id, name, gpa
    FROM students
    WHERE gpa >= 3.7
    ORDER BY gpa DESC
  required_tables: [students]
  tags: [filter, jargon]
  expected_row_count: 5

- id: univ_006
  question: "How many courses does each instructor teach?"
  gold_sql: >
    SELECT i.name AS instructor, COUNT(c.course_id) AS course_count
    FROM instructors i
    LEFT JOIN courses c ON i.instructor_id = c.instructor_id
    GROUP BY i.instructor_id, i.name
    ORDER BY course_count DESC
  required_tables: [instructors, courses]
  tags: [join, aggregate]

- id: univ_007
  question: "What grades did Alice Thomas receive in all her courses?"
  gold_sql: >
    SELECT c.title, g.score, g.letter_grade
    FROM students s
    JOIN enrollments e ON s.student_id = e.student_id
    JOIN courses c ON e.course_id = c.course_id
    JOIN grades g ON e.enrollment_id = g.enrollment_id
    WHERE s.name = 'Alice Thomas'
  required_tables: [students, enrollments, courses, grades]
  tags: [filter, join]

- id: univ_008
  question: "Which students scored an A grade in Database Systems?"
  gold_sql: >
    SELECT s.name
    FROM students s
    JOIN enrollments e ON s.student_id = e.student_id
    JOIN courses c ON e.course_id = c.course_id
    JOIN grades g ON e.enrollment_id = g.enrollment_id
    WHERE c.title = 'Database Systems' AND g.letter_grade = 'A'
  required_tables: [students, enrollments, courses, grades]
  tags: [filter, join]

- id: univ_009
  question: "What is the total number of credits offered per department?"
  gold_sql: >
    SELECT d.name AS department, SUM(c.credits) AS total_credits
    FROM courses c
    JOIN departments d ON c.dept_id = d.dept_id
    GROUP BY d.dept_id, d.name
    ORDER BY total_credits DESC
  required_tables: [courses, departments]
  tags: [join, aggregate]

- id: univ_010
  question: "List all Professor-ranked instructors and their departments."
  gold_sql: >
    SELECT i.name, d.name AS department
    FROM instructors i
    JOIN departments d ON i.dept_id = d.dept_id
    WHERE i.rank = 'Professor'
  required_tables: [instructors, departments]
  tags: [filter, join]

- id: univ_011
  question: "How many students are in each academic year?"
  gold_sql: >
    SELECT year, COUNT(*) AS student_count
    FROM students
    WHERE status = 'active'
    GROUP BY year
    ORDER BY year
  required_tables: [students]
  tags: [filter, aggregate]

- id: univ_012
  question: "Which course has the most enrolled students in 2024-Fall?"
  gold_sql: >
    SELECT c.title, COUNT(e.enrollment_id) AS enrollment_count
    FROM courses c
    JOIN enrollments e ON c.course_id = e.course_id
    WHERE e.semester = '2024-Fall'
    GROUP BY c.course_id, c.title
    ORDER BY enrollment_count DESC
    LIMIT 1
  required_tables: [courses, enrollments]
  tags: [filter, join, aggregate]
  expected_row_count: 1

- id: univ_013
  question: "What is the average score by letter grade?"
  gold_sql: >
    SELECT letter_grade, ROUND(AVG(score), 2) AS avg_score, COUNT(*) AS count
    FROM grades
    GROUP BY letter_grade
    ORDER BY avg_score DESC
  required_tables: [grades]
  tags: [aggregate]

- id: univ_014
  question: "List students who have graduated."
  gold_sql: >
    SELECT student_id, name, gpa
    FROM students
    WHERE status = 'graduated'
  required_tables: [students]
  tags: [filter]

- id: univ_015
  question: "Which departments have a budget greater than 1 million?"
  gold_sql: >
    SELECT name, budget
    FROM departments
    WHERE budget > 1000000
    ORDER BY budget DESC
  required_tables: [departments]
  tags: [filter]

- id: univ_016
  question: "How many students enrolled in each course during 2025-Spring?"
  gold_sql: >
    SELECT c.code, c.title, COUNT(e.enrollment_id) AS enrolled
    FROM courses c
    JOIN enrollments e ON c.course_id = e.course_id
    WHERE e.semester = '2025-Spring'
    GROUP BY c.course_id, c.code, c.title
  required_tables: [courses, enrollments]
  tags: [filter, join, aggregate]

- id: univ_017
  question: "Who are the top 3 students by GPA?"
  gold_sql: >
    SELECT name, gpa
    FROM students
    WHERE status = 'active'
    ORDER BY gpa DESC
    LIMIT 3
  required_tables: [students]
  tags: [filter, aggregate]
  expected_row_count: 3

- id: univ_018
  question: "What is the name of the student with the highest score in Machine Learning?"
  gold_sql: >
    SELECT s.name, g.score
    FROM students s
    JOIN enrollments e ON s.student_id = e.student_id
    JOIN courses c ON e.course_id = c.course_id
