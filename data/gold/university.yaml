  tags: [aggregate]

- id: univ_023
  question: "List high performers in Computer Science."
  gold_sql: >
    SELECT s.name, s.gpa
    FROM students s
    JOIN departments d ON s.dept_id = d.dept_id
    WHERE d.code = 'CSE' AND s.gpa >= 3.7
    ORDER BY s.gpa DESC
  required_tables: [students, departments]
  tags: [filter, join, jargon]

- id: univ_024
  question: "Which students are in the IT department?"
  gold_sql: >
    SELECT s.name, s.gpa, s.year
    FROM students s
    JOIN departments d ON s.dept_id = d.dept_id
    WHERE d.code = 'CSE'
  required_tables: [students, departments]
  tags: [filter, join, ambiguous]

- id: univ_025
  question: "What is the pass rate per course?"
  gold_sql: >
    SELECT c.title,
           COUNT(*) AS total,
           SUM(CASE WHEN g.letter_grade != 'F' THEN 1 ELSE 0 END) AS passed,
           ROUND(100.0 * SUM(CASE WHEN g.letter_grade != 'F' THEN 1 ELSE 0 END) / COUNT(*), 1) AS pass_rate_pct
    FROM courses c
    JOIN enrollments e ON c.course_id = e.course_id
    JOIN grades g ON e.enrollment_id = g.enrollment_id
    GROUP BY c.course_id, c.title
    ORDER BY pass_rate_pct DESC
  required_tables: [courses, enrollments, grades]
  tags: [join, aggregate]
