# data/gold/ecommerce.yaml
# Gold NL<->SQL pairs for the ecommerce database.
# T-1.12: ~25 questions

- id: eco_001
  question: "What is the total revenue from all delivered orders?"
  gold_sql: >
    SELECT ROUND(SUM(p.amount), 2) AS total_revenue
    FROM payments p
    JOIN orders o ON p.order_id = o.order_id
    WHERE o.status = 'delivered' AND p.status = 'paid'
  required_tables: [payments, orders]
  tags: [filter, join, aggregate]
  expected_row_count: 1

- id: eco_002
  question: "List all products in the Electronics category."
  gold_sql: >
    SELECT p.name, p.price, p.stock
    FROM products p
    JOIN categories c ON p.category_id = c.category_id
    WHERE c.name = 'Electronics'
    ORDER BY p.price DESC
  required_tables: [products, categories]
  tags: [filter, join]

- id: eco_003
  question: "How many orders were placed by each customer?"
  gold_sql: >
    SELECT c.name, COUNT(o.order_id) AS order_count
    FROM customers c
    LEFT JOIN orders o ON c.customer_id = o.customer_id
    GROUP BY c.customer_id, c.name
    ORDER BY order_count DESC
  required_tables: [customers, orders]
  tags: [join, aggregate]

- id: eco_004
  question: "What is the revenue breakdown by product category?"
  gold_sql: >
    SELECT cat.name AS category,
           ROUND(SUM(oi.quantity * oi.unit_price), 2) AS revenue
    FROM order_items oi
    JOIN products p ON oi.product_id = p.product_id
    JOIN categories cat ON p.category_id = cat.category_id
    JOIN orders o ON oi.order_id = o.order_id
    WHERE o.status = 'delivered'
    GROUP BY cat.category_id, cat.name
    ORDER BY revenue DESC
  required_tables: [order_items, products, categories, orders]
  tags: [join, aggregate]

- id: eco_005
  question: "Which orders are currently pending?"
  gold_sql: >
    SELECT o.order_id, c.name AS customer, o.order_date
    FROM orders o
    JOIN customers c ON o.customer_id = c.customer_id
    WHERE o.status = 'pending'
  required_tables: [orders, customers]
  tags: [filter, join]

- id: eco_006
  question: "What is the most popular payment method?"
  gold_sql: >
    SELECT method, COUNT(*) AS usage_count
    FROM payments
    WHERE status = 'paid'
    GROUP BY method
    ORDER BY usage_count DESC
    LIMIT 1
  required_tables: [payments]
  tags: [filter, aggregate]
  expected_row_count: 1

- id: eco_007
  question: "Which products are out of stock?"
  gold_sql: >
    SELECT name, category_id, price
    FROM products
    WHERE stock = 0
  required_tables: [products]
  tags: [filter]

- id: eco_008
  question: "List customers from Mumbai."
  gold_sql: >
    SELECT customer_id, name, email, joined_date
    FROM customers
    WHERE city = 'Mumbai'
    ORDER BY joined_date
  required_tables: [customers]
  tags: [filter]

- id: eco_009
  question: "What is the average order value?"
  gold_sql: >
    SELECT ROUND(AVG(amount), 2) AS avg_order_value
    FROM payments
    WHERE status = 'paid'
  required_tables: [payments]
  tags: [aggregate]
  expected_row_count: 1

- id: eco_010
  question: "How many refunded orders are there?"
  gold_sql: >
    SELECT COUNT(*) AS refund_count
    FROM orders
    WHERE status = 'refunded'
  required_tables: [orders]
  tags: [filter, aggregate]
  expected_row_count: 1

- id: eco_011
  question: "Which customers have never placed an order?"
  gold_sql: >
    SELECT c.customer_id, c.name, c.email
    FROM customers c
    LEFT JOIN orders o ON c.customer_id = o.customer_id
    WHERE o.order_id IS NULL
  required_tables: [customers, orders]
  tags: [join, filter]

- id: eco_012
  question: "What are the top 3 best-selling products by quantity?"
  gold_sql: >
    SELECT p.name, SUM(oi.quantity) AS total_sold
    FROM order_items oi
    JOIN products p ON oi.product_id = p.product_id
    GROUP BY p.product_id, p.name
    ORDER BY total_sold DESC
    LIMIT 3
  required_tables: [order_items, products]
  tags: [join, aggregate]
  expected_row_count: 3

- id: eco_013
  question: "How much revenue was generated in June 2024?"
  gold_sql: >
    SELECT ROUND(SUM(p.amount), 2) AS june_revenue
    FROM payments p
    WHERE p.status = 'paid'
      AND p.paid_date LIKE '2024-06%'
  required_tables: [payments]
  tags: [filter, aggregate]
  expected_row_count: 1

- id: eco_014
  question: "Which product categories have more than 3 products?"
  gold_sql: >
    SELECT c.name, COUNT(p.product_id) AS product_count
    FROM categories c
    JOIN products p ON c.category_id = p.category_id
    GROUP BY c.category_id, c.name
    HAVING COUNT(p.product_id) > 3
  required_tables: [categories, products]
  tags: [join, aggregate, filter]

- id: eco_015
  question: "List all orders placed in April 2024."
  gold_sql: >
    SELECT o.order_id, c.name AS customer, o.order_date, o.status
    FROM orders o
    JOIN customers c ON o.customer_id = c.customer_id
    WHERE o.order_date LIKE '2024-04%'
    ORDER BY o.order_date
  required_tables: [orders, customers]
  tags: [filter, join]

- id: eco_016
  question: "What is the total stock value of all products?"
  gold_sql: >
    SELECT ROUND(SUM(price * stock), 2) AS total_stock_value
    FROM products
  required_tables: [products]
  tags: [aggregate]
  expected_row_count: 1

- id: eco_017
  question: "Which churned customers have not ordered recently?"
  gold_sql: >
    SELECT c.name, c.email,
           MAX(o.order_date) AS last_order
    FROM customers c
    LEFT JOIN orders o ON c.customer_id = o.customer_id
    GROUP BY c.customer_id, c.name, c.email
    HAVING MAX(o.order_date) < date('now', '-180 days') OR MAX(o.order_date) IS NULL
    ORDER BY last_order
  required_tables: [customers, orders]
  tags: [join, aggregate, jargon]

- id: eco_018
  question: "What is the average number of items per order?"
  gold_sql: >
    SELECT ROUND(AVG(item_count), 2) AS avg_items_per_order
    FROM (
      SELECT order_id, SUM(quantity) AS item_count
      FROM order_items
      GROUP BY order_id
    )
  required_tables: [order_items]
  tags: [aggregate]
  expected_row_count: 1

- id: eco_019
  question: "Show all orders with their total amounts."
  gold_sql: >
    SELECT o.order_id, c.name AS customer, o.order_date, p.amount, o.status
    FROM orders o
    JOIN customers c ON o.customer_id = c.customer_id
    JOIN payments p ON o.order_id = p.order_id
    ORDER BY o.order_date DESC
  required_tables: [orders, customers, payments]
  tags: [join]

- id: eco_020
  question: "How many orders were placed in each month of 2024?"
  gold_sql: >
    SELECT SUBSTR(order_date, 1, 7) AS month, COUNT(*) AS order_count
    FROM orders
    WHERE order_date LIKE '2024%'
    GROUP BY month
    ORDER BY month
  required_tables: [orders]
  tags: [filter, aggregate]

- id: eco_021
  question: "List the most expensive products."
  gold_sql: >
    SELECT name, price
    FROM products
    ORDER BY price DESC
    LIMIT 5
  required_tables: [products]
  tags: [aggregate]
  expected_row_count: 5

- id: eco_022
  question: "What is the total quantity sold per category?"
  gold_sql: >
    SELECT cat.name, SUM(oi.quantity) AS total_quantity
    FROM order_items oi
    JOIN products p ON oi.product_id = p.product_id
    JOIN categories cat ON p.category_id = cat.category_id
    GROUP BY cat.category_id, cat.name
    ORDER BY total_quantity DESC
  required_tables: [order_items, products, categories]
  tags: [join, aggregate]

- id: eco_023
  question: "Which customers joined in 2023?"
  gold_sql: >
    SELECT name, email, city, joined_date
    FROM customers
    WHERE joined_date LIKE '2023%'
    ORDER BY joined_date
  required_tables: [customers]
  tags: [filter]

- id: eco_024
  question: "Show me failed payments."
  gold_sql: >
    SELECT p.payment_id, o.order_id, c.name AS customer, p.amount
    FROM payments p
    JOIN orders o ON p.order_id = o.order_id
    JOIN customers c ON o.customer_id = c.customer_id
    WHERE p.status = 'failed'
  required_tables: [payments, orders, customers]
  tags: [filter, join]

- id: eco_025
  question: "What is the revenue per customer?"
  gold_sql: >
    SELECT c.name, ROUND(SUM(p.amount), 2) AS total_spent
    FROM customers c
    JOIN orders o ON c.customer_id = o.customer_id
    JOIN payments p ON o.order_id = p.order_id
    WHERE p.status = 'paid'
    GROUP BY c.customer_id, c.name
    ORDER BY total_spent DESC
  required_tables: [customers, orders, payments]
  tags: [join, aggregate]
